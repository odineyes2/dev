<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>dev</title>
<link rel="stylesheet" href="/app.css">
<script>/* 처음 그릴 때부터 고른 테마로(깜빡임 방지) — 'light'|'dark', 없으면 자동 */
  try{ const t = localStorage.getItem('dev.theme'); if(t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; }catch(e){}</script>
</head>
<body>
<div id="login" class="login" hidden>
  <form id="login-form" class="login-box">
    <div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 1 0 10.5 10.5Z" fill="currentColor"/></svg><span class="brand-word">Dev</span></div>
    <p class="dim">nightshift 관리자 계정으로 로그인해요.</p>
    <input id="login-username" autocomplete="username" placeholder="아이디" required>
    <input id="login-password" type="password" autocomplete="current-password" placeholder="비밀번호" required>
    <button type="submit" class="primary">로그인</button>
    <p id="login-error" class="error"></p>
  </form>
</div>

<div id="shell" hidden>
  <header class="top">
    <a href="#/" class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 1 0 10.5 10.5Z" fill="currentColor"/></svg><span class="brand-word">Dev</span></a>
    <nav>
      <a href="#/" data-nav="issues">Issues</a>
      <a href="#/board" data-nav="board">Board</a>
      <a href="#/agents" data-nav="agents">Agents</a>
      <a href="#/projects" data-nav="projects">Projects</a>
    </nav>
    <select id="project-filter" title="프로젝트"></select>
    <a href="#/new" class="button primary" title="New issue">+<span class="hide-m"> New issue</span></a>
    <button id="theme" class="ghost" title="테마 바꾸기"></button>
    <button id="logout" class="ghost" title="Log out"><svg viewBox="0 0 24 24" aria-hidden="true" class="ico"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="hide-m">Log out</span></button>
  </header>
  <main id="view"></main>
</div>
<div id="toast" class="toast" hidden></div>
<script src="/app.js"></script>
</body>
</html>
