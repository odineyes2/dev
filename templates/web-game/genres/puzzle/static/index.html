<!-- 퍼즐 격자와 이동·되돌리기 및 공통 점수 영역을 표시한다. -->
<!doctype html>
<!-- 게임 화면과 점수 기록을 표시한다. -->
<html lang="ko" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{PROJECT_NAME}}</title><link rel="stylesheet" href="/static/family.css"><link rel="stylesheet" href="/static/app.css"><link rel="stylesheet" href="/static/genre.css"><script defer src="/static/game.js"></script><script defer src="/static/app.js"></script></head>
<body><header class="top"><a class="brand" href="/"><svg class="ico brand-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 1 0 10.5 10.5Z"/></svg><span class="brand-word">{{PROJECT_NAME}}</span></a><div class="header-right">
<!-- [option:dark_mode] -->
<button id="theme" class="theme-toggle-btn" title="밤/낮" aria-label="밤/낮"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z"/></svg></button>
<!-- [/option:dark_mode] -->
</div></header><main><h1>Sliding Puzzle</h1>
<p>빈칸 옆의 숫자를 누르거나 방향키로 빈칸을 움직여 1부터 15까지 맞춰보세요.</p>
<div class="game-toolbar"><span id="status" role="status"></span><button id="pause" type="button">일시정지</button><button id="undo" type="button">되돌리기</button><button id="restart" type="button">다시 섞기</button></div>
<div id="game" role="group" aria-label="4×4 슬라이드 퍼즐"></div>
<p class="dim">한 번 움직이면 한 턴이에요. 되돌리기로 이전 턴으로 돌아갈 수 있어요.</p>
<!-- [option:scores] -->
<section><h2>Top scores</h2><form id="scores"><label>이름 <input id="name" required minlength="1" maxlength="20" value="플레이어"></label><button type="submit">점수 기록</button></form><p id="score-message" role="status"></p><ol id="leaders"></ol><p class="dim">공개 연습용 기록이에요. 실제 서비스의 인증·남용 방지는 별도로 준비해 주세요.</p></section>
<!-- [/option:scores] -->
</main></body></html>
